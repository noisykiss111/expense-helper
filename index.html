<script>
/* ===== 导出 Excel：按 Jane 原来的报销表格式 ===== */
const HEADERS = ["", "报销人", "开支类型", "开支日期", "开支内容描述", "开支金额 RMB", "开支金额币种", "登记顺序", "上传收据/发票", "提交人"];

function pad2(n) { return String(n).padStart(2, "0"); }
function dotDate(iso) { return iso ? iso.replace(/-/g, ".") : ""; }
function compactDate(iso) { return iso ? iso.replace(/-/g, "") : ""; }
function fmtAmount(n) { return (Math.round(Number(n) * 100) / 100).toString(); }

function sortExpenses(list) {
  return list.slice().sort((a, b) =>
    (a.date || "9999").localeCompare(b.date || "9999") || (a.time || "99:99").localeCompare(b.time || "99:99") || (a.addedAt || 0) - (b.addedAt || 0));
}

function receiptLabel(e, trip, settings) {
  return `【${compactDate(e.date)}】【${fmtAmount(e.amount)} ${e.currency || "RMB"}】【${settings.short}】${trip.name}${e.content}`;
}

/* 把费用分到收据页：每页一笔，或每页最多 3 张图（同一笔的图不拆开） */
function planPages(items, perPage) {
  const withImg = items.filter(it => it.e.images && it.e.images.length);
  const totalImgs = withImg.reduce((s, it) => s + it.e.images.length, 0);
  const mode = perPage === "auto" ? (totalImgs > 10 ? 3 : 1) : Number(perPage);
  const pages = [];
  let cur = null;
  for (const it of withImg) {
    const k = it.e.images.length;
    if (mode === 1 || !cur || cur.slots + k > 3) {
      cur = { items: [], slots: 0 };
      pages.push(cur);
    }
    cur.items.push(it);
    cur.slots += k;
  }
  for (const p of pages) {
    const a = p.items[0].no, b = p.items[p.items.length - 1].no;
    p.name = a === b ? String(a) : `${a}-${b}`;
  }
  return pages;
}

/* getImage(img) -> Promise<{base64, w, h}>（base64 不带前缀，jpeg） */
async function buildWorkbook(ExcelJS, trip, settings, getImage) {
  const wb = new ExcelJS.Workbook();
  const font = { name: "宋体", size: 12 };
  const linkFont = { name: "宋体", size: 12, color: { argb: "FF0563C1" }, underline: true };
  const ws = wb.addWorksheet("sheet1");
  const widths = [10, 13, 13, 13, 55, 16, 10, 13, 70, 10];
  ws.columns = widths.map(w => ({ width: w }));
  ws.addRow(HEADERS).eachCell(c => { c.font = { ...font, bold: true }; });

  const items = sortExpenses(trip.expenses).map((e, i) => ({ e, no: i + 1 }));
  const pages = planPages(items, trip.perPage || "auto");
  const pageOf = new Map();
  pages.forEach(p => p.items.forEach(it => pageOf.set(it.no, p.name)));

  for (const { e, no } of items) {
    const [y, m, d] = (e.date || "1970-01-01").split("-").map(Number);
    const label = receiptLabel(e, trip, settings);
    const row = ws.addRow([
      trip.project, settings.reporter, e.type, new Date(Date.UTC(y, m - 1, d)),
      `${dotDate(e.date)} ${e.content}`, Number(e.amount), e.currency || "RMB",
      no, label, settings.submitter,
    ]);
    row.eachCell(c => { c.font = font; });
    row.getCell(4).numFmt = "yyyy-mm-dd";
    const pn = pageOf.get(no);
    if (pn) {
      row.getCell(9).value = { text: label, hyperlink: `#'${pn}'!A1` };
      row.getCell(9).font = linkFont;
    }
  }
  const last = items.length + 1;
  const totalRow = ws.addRow([]);
  totalRow.getCell(5).value = "合计";
  totalRow.getCell(5).font = { ...font, bold: true };
  const sum = items.reduce((s, it) => s + Number(it.e.amount || 0), 0);
  totalRow.getCell(6).value = { formula: `SUM(F2:F${last})`, result: Math.round(sum * 100) / 100 };
  totalRow.getCell(6).font = { ...font, bold: true };

  /* 收据页 */
  const IMG_W = 420, COL_STEP = 7;
  for (const p of pages) {
    const s = wb.addWorksheet(p.name);
    s.getCell("A1").value = { text: "← 返回汇总表", hyperlink: "#'sheet1'!A1" };
    s.getCell("A1").font = { ...linkFont, size: 12 };
    let col = 0;
    for (const { e, no } of p.items) {
      const label = receiptLabel(e, trip, settings);
      const multi = e.images.length > 1;
      for (let k = 0; k < e.images.length; k++) {
        const cell = s.getRow(2).getCell(col + 1);
        cell.value = `${no}. ${label}${multi ? "_" + (k + 1) : ""}`;
        cell.font = { name: "宋体", size: 10 };
        const img = await getImage(e.images[k]);
        if (img) {
          const id = wb.addImage({ base64: img.base64, extension: "jpeg" });
          s.addImage(id, { tl: { col, row: 2 }, ext: { width: IMG_W, height: Math.round(IMG_W * img.h / img.w) }, editAs: "oneCell" });
        }
        col += COL_STEP;
      }
    }
  }
  return wb;
}

/* ExcelJS 写出的「表内跳转」链接 Excel/WPS 认不出，这里改成标准写法 */
async function fixHyperlinks(JSZip, buffer) {
  const zip = await JSZip.loadAsync(buffer);
  for (const name of Object.keys(zip.files)) {
    if (!/^xl\/worksheets\/sheet\d+\.xml$/.test(name)) continue;
    const xml = await zip.file(name).async("string");
    const dropIds = [];
    const fixed = xml.replace(/<hyperlink ref="([A-Z]+\d+)" r:id="(rId\d+)" location="#([^"]+)"\s*\/>/g, (m, ref, rid, loc) => {
      dropIds.push(rid);
      return `<hyperlink ref="${ref}" location="${loc}"/>`;
    });
    if (!dropIds.length) continue;
    zip.file(name, fixed);
    const relName = name.replace("worksheets/", "worksheets/_rels/") + ".rels";
    const rf = zip.file(relName);
    if (rf) {
      let rels = await rf.async("string");
      for (const id of dropIds) rels = rels.replace(new RegExp(`<Relationship Id="${id}"[^>]*/>`), "");
      zip.file(relName, rels);
    }
  }
  return zip.generateAsync({ type: "uint8array", compression: "DEFLATE" });
}

function exportFileName(trip, settings) {
  const ds = trip.expenses.map(x => x.date).filter(Boolean).sort();
  const year = (ds[ds.length - 1] || new Date().toISOString()).slice(0, 4);
  const safe = s => String(s).replace(/[\\/:*?"<>|]/g, "");
  const who = safe((settings && (settings.submitter || settings.reporter)) || "");
  return `${year}年${safe(trip.name)}_${who ? who + "_" : ""}报销.xlsx`;
}

if (typeof module !== "undefined") module.exports = { buildWorkbook, fixHyperlinks, exportFileName, receiptLabel, planPages, sortExpenses };

</script>
<script>
/* ============ 状态 ============ */
const TYPES = ["交通费", "餐费", "其他"];
const PROJECTS = ["Roadshow", "Fam Trip", "采购"];
const CURRENCIES = ["RMB", "USD", "EUR", "HKD", "GBP", "AUD", "CAD", "JPY"];
const S = {
  ready: false, loading: true, loadNote: "",
  db: null, col: null, uid: null, assets: null, sample: null, downloads: null, aiImages: false, aiOff: false,
  settings: { reporter: "", short: "", submitter: "" },
  mode: "memory",              // cloud：云端；local：只存在这台设备的浏览器；memory：都不行
  trips: [], curId: null, tab: "list", filter: "all", editing: new Set(),
};
const localImgs = {};          // 没有云端存储时，图片只放在内存里
let addTargetId = null;        // 给哪一笔费用追加图片

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const money = n => "¥" + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString("zh-CN", { maximumFractionDigits: 2 });
const today = () => new Date().toISOString().slice(0, 10);
const cur = () => S.trips.find(t => t.id === S.curId);
function toast(msg, ms = 2600) { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.append(d); setTimeout(() => d.remove(), ms); }

/* ============ 本机存储（IndexedDB）：别人用这个应用、不能存云端时的备用方案 ============ */
const LDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open("expense-helper", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("docs"); r.result.createObjectStore("imgs"); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async op(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction(store, mode); const q = fn(tx.objectStore(store)); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); });
  },
  put(store, k, v) { return this.op(store, "readwrite", s => s.put(v, k)); },
  get(store, k) { return this.op(store, "readonly", s => s.get(k)); },
  del(store, k) { return this.op(store, "readwrite", s => s.delete(k)); },
  async all(store) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const out = []; const tx = db.transaction(store, "readonly"); const c = tx.objectStore(store).openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
    });
  },
};
let localOK = false;

/* ============ 保存 ============ */
const writing = {}, dirty = {}, timers = {};
function saveDoc(docId, getBody) {
  if (S.mode === "memory") return;
  dirty[docId] = getBody;
  if (!writing[docId]) flush(docId);
}
function switchToLocal() {
  if (!localOK) { S.mode = "memory"; S.loadNote = "这个页面现在没法保存数据：关掉页面后记录会消失，请在当天整理完并导出。"; render(); return; }
  S.mode = "local";
  S.loadNote = "你的记录保存在这台设备的浏览器里：换设备看不到，清理浏览器数据会丢失。导出报销表之后再清理。";
  S.trips.forEach(t => saveDoc("trip-" + t.id, () => t));
  if (S.settings.reporter) saveDoc("settings", () => S.settings);
  render();
}
async function flush(docId) {
  writing[docId] = true;
  while (dirty[docId]) {
    const g = dirty[docId]; dirty[docId] = null;
    const body = JSON.parse(JSON.stringify(g()));
    try {
      if (S.mode === "cloud") await S.col.doc(docId).set(body);
      else if (S.mode === "local") await LDB.put("docs", docId, body);
    } catch (e) {
      const code = e && e.code;
      if (S.mode === "cloud" && (code === "invalid_argument" || code === "revoked" || code === "not_granted")) { switchToLocal(); }
      else if (code === "quota_exceeded") toast("云端空间满了，保存失败");
      else if (code === "unavailable") { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); if (!dirty[docId]) dirty[docId] = g; }
      else toast("保存失败，请检查网络");
    }
  }
  writing[docId] = false;
}
async function removeDoc(docId) {
  try { if (S.mode === "cloud") await S.col.doc(docId).delete(); else if (S.mode === "local") await LDB.del("docs", docId); } catch { }
}
function saveTrip(t, delay = 0) {
  clearTimeout(timers[t.id]);
  const go = () => saveDoc("trip-" + t.id, () => t);
  if (delay) timers[t.id] = setTimeout(go, delay); else go();
}
function saveSettings() { saveDoc("settings", () => S.settings); }

/* ============ 启动 ============ */
async function init() {
  render();
  loadAI();
  try { await LDB.open(); localOK = true; } catch { localOK = false; }
  const docs = [];
  if (localOK) {
    S.mode = "local";
    try { (await LDB.all("docs")).forEach(kv => docs.push(kv)); } catch { }
    try { for (const [k, blob] of await LDB.all("imgs")) localImgs[k] = URL.createObjectURL(blob); } catch { }
  } else {
    S.mode = "memory";
    S.loadNote = "这个浏览器不能保存数据（可能开了无痕模式）：关掉页面后记录会消失，请整理完马上导出。";
  }
  S.trips = [];
  docs.forEach(([id, v]) => {
    if (id === "settings") S.settings = { ...S.settings, ...v };
    else if (id.startsWith("trip-")) {
      const t = JSON.parse(JSON.stringify(v));
      (t.expenses || []).forEach(e => { if (e.status === "reading") { e.status = "pending"; e.aiNote = "上次识别被中断了，请手动核对"; } });
      S.trips.push(t);
    }
  });
  S.trips.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  S.loading = false; S.ready = true;
  render();
  if (!S.settings.reporter) settingsForm(true);
  if (S.setupDone) toast("✓ AI 识别已自动设置好，可以直接上传截图了", 4000);
  if (S.setupBad) toast("设置链接不完整，请让发链接的人重新复制一次", 4000);
}
function shareLink() {
  const cfg = { provider: S.ai.provider, endpoint: S.ai.endpoint, model: S.ai.model, key: S.ai.key };
  const code = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))));
  return location.origin + location.pathname + "#setup=" + code;
}

/* ============ AI 设置（千问 / 豆包 / 其他 OpenAI 兼容接口） ============ */
const AI_PRESETS = {
  deepseek: { name: "DeepSeek", endpoint: "https://api.deepseek.com/chat/completions", model: "deepseek-flash", help: "在 DeepSeek 开放平台创建 API Key；看图要用 Flash 模型（deepseek-flash），Pro 模型不能看图" },
  qwen: { name: "通义千问（阿里云百炼）", endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", model: "qwen-vl-plus", help: "在阿里云百炼控制台创建 API Key；模型可填 qwen-vl-plus 或 qwen-vl-max" },
  doubao: { name: "豆包（火山方舟）", endpoint: "https://ark.cn-beijing.volces.com/api/v3/chat/completions", model: "", help: "在火山方舟控制台创建 API Key，并复制一个「视觉理解」模型的 Model ID 填到模型一栏" },

function parseJSON(text) {
  const t = String(text).replace(/<think>[\s\S]*?<\/think>/g, "").replace(/<\|(begin|end)_of_box\|>/g, "").trim();
  try { return JSON.parse(t); } catch { }
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch { } }
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch { } }
  return null;
}

  if (e && e.status === 402) return "账户余额不足，请先充值";

/* ============ 图片：压缩 + 上传 ============ */
async function compress(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const scale = Math.min(1, 1000 / img.naturalWidth, 1800 / img.naturalHeight);
  const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
  return { blob, w, h };
}
async function storeImage(file) {
  const { blob, w, h } = await compress(file);
  const key = uid(); localImgs[key] = URL.createObjectURL(blob);
  if (localOK) { try { await LDB.put("imgs", key, blob); } catch { } }
  return { img: { local: key, w, h }, blob };
}
const imgSrc = im => localImgs[im.local] || "";

const aiQueue = []; let aiRunning = 0;
function enqueueAI(trip, exp, blob) { aiQueue.push({ trip, exp, blob }); pumpAI(); }
async function pumpAI() {
  while (aiRunning < 2 && aiQueue.length) {
    const job = aiQueue.shift(); aiRunning++;
    readShot(job).finally(() => { aiRunning--; pumpAI(); });
  }
}
function aiPrompt(trip) {
  return `你是出差报销助手。附图是一张出差期间的付款截图、打车/订票订单截图或发票。请读出这笔费用的信息。
出差信息：${trip.name}，项目 ${trip.project}${trip.city ? "，地点 " + trip.city : ""}。今天是 ${today()}。

请仔细看图上所有文字（商户名、地址、起点终点、航班/车次、时间、人数、商品明细、支付方式、订单号），尽量多挖掘有用信息。

规则：
- amount：实际支付的金额（优惠/折扣之后），只要数字。
- date：消费发生的日期，格式 YYYY-MM-DD；截图没写年份时，取离今天最近、且不晚于今天的那一年；完全看不出就 null。
- time：付款时间，格式 HH:MM（24 小时制），只用来排序；看不出就空字符串。
- currency：RMB、USD、EUR、HKD 等，人民币写 RMB。
- type：只能是 "交通费"（打车、机票、火车、地铁、停车、送机）、"餐费"（吃饭、咖啡、饮料）、"其他"（门票、礼品、采购、代付等）。
- content：格式是「店名 + 做了什么」，不要写日期和时间（时间单独放在 time 里），不超过 25 个字。店名要具体（商户名、酒店名、航空公司）；打车没有店名，就写「起点→终点 打车」。参考写法：
  「星巴克 买咖啡」「滴滴 光谷→天河机场T3 打车」「艾美富力酒店→海尔洲际酒店 打车」「青未了餐厅 午饭」「东航 武汉-青岛往返机票」「栈桥码头 city tour门票」。
  做了什么要合理推测，看不出就只写消费内容，不要编造人名或人数。
- isInvoice：这张图是不是正式发票。
- confidence：你对金额和日期的把握，"high" / "medium" / "low"。
- note：需要人核对的地方（比如推测的用途不确定），没有就写空字符串。

只回复一个 JSON 对象，例如：
{"date":"2026-10-25","time":"09:41","amount":36,"currency":"RMB","type":"餐费","content":"星巴克 买咖啡","isInvoice":false,"confidence":"high","note":""}`;
}
async function readShot({ trip, exp, blob }) {
  try {
    const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
    const text = await callAI([{ type: "image_url", image_url: { url: dataUrl } }, { type: "text", text: aiPrompt(trip) }]);
    const r = parseJSON(text);
    if (!r) throw new Error("回复格式不对");
    if (r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) exp.date = r.date;
    if (r.amount != null && !isNaN(Number(r.amount))) exp.amount = Math.round(Number(r.amount) * 100) / 100;
    if (CURRENCIES.includes(r.currency)) exp.currency = r.currency;
    if (TYPES.includes(r.type)) exp.type = r.type;
    if (r.content) exp.content = String(r.content).slice(0, 50);
    if (r.time && /^\d{1,2}:\d{2}$/.test(r.time)) exp.time = r.time.padStart(5, "0");

    exp.isInvoice = !!r.isInvoice;
    exp.aiConf = ["high", "medium", "low"].includes(r.confidence) ? r.confidence : "medium";
    exp.aiNote = r.note ? String(r.note).slice(0, 120) : "";
  } catch (e) {
    exp.aiNote = aiErrorText(e) + "，请手动填写";
    exp.aiConf = "low";
  }
  exp.status = "pending";
  saveTrip(trip);
  if (S.curId === trip.id) render();
}

  const seen = {}, dups = [];
  list.forEach(e => { const k = e.date + "|" + Number(e.amount); if (e.date && e.amount !== "") { if (seen[k]) dups.push([seen[k], e]); else seen[k] = e; } });
  const noImg = list.filter(e => !e.images.length);
  const invoice = list.filter(e => e.needInvoice);
  const foreign = list.filter(e => e.currency && e.currency !== "RMB");
  const checks = [];
  checks.push(pending.length
    ? { lvl: "bad", t: `还有 ${pending.length} 笔没确认`, d: "每一笔都要对照截图核对后点「确认」，才能导出。", items: pending.map(label) }
    : { lvl: "good", t: "全部费用都已确认" });
  if (incomplete.length) checks.push({ lvl: "bad", t: `${incomplete.length} 笔信息不完整`, items: incomplete.map(e => label(e) + "：缺" + missing(e).join("、")) });
  if (dups.length) checks.push({ lvl: "warn", t: `${dups.length} 组可能重复（同一天、同金额）`, d: "如果确实是两笔（比如同一天买了两杯一样价格的咖啡），可以忽略。", items: dups.map(([a, b]) => `${label(a)} ↔ ${b.content}`) });
  if (noImg.length) checks.push({ lvl: "warn", t: `${noImg.length} 笔没有截图或发票`, items: noImg.map(label) });
  if (invoice.length) checks.push({ lvl: "warn", t: `${invoice.length} 笔标记了「需补开发票」`, d: "提交报销前记得开好发票。", items: invoice.map(label) });
  if (foreign.length) checks.push({ lvl: "warn", t: `${foreign.length} 笔不是人民币`, d: "表格 F 列标题是「开支金额 RMB」，确认一下公司要不要先换算。", items: foreign.map(e => label(e) + " " + e.currency) });
  const canExport = list.length > 0 && !pending.length && !incomplete.length;
  return { checks, canExport };
}
async function doExport() {
  const t = cur();
  if (!window.ExcelJS) return toast("导出组件还没加载好，请稍后再试");
  const btn = $("#exportBtn"); if (btn) { btn.disabled = true; btn.textContent = "正在生成…"; }
  try {
    const getImage = async im => {
      const src = imgSrc(im); if (!src) return null;
      const blob = await (await fetch(src)).blob();
      const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
      return { base64: b64, w: im.w || 1000, h: im.h || 1800 };
    };
    const wb = await buildWorkbook(ExcelJS, t, S.settings, getImage);
    let buf = await wb.xlsx.writeBuffer();
    if (window.JSZip) buf = await fixHyperlinks(JSZip, buf);
    const url = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = document.createElement("a"); a.href = url; a.download = exportFileName(t, S.settings);
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
    t.exportedAt = Date.now(); saveTrip(t); toast("已导出 ✓");
  } catch (e) {
    toast("导出失败：" + ((e && (e.message || e.code)) || "未知错误"));
  }
  render();
}

/* ============ 页面渲染 ============ */
function render() {
  const app = $("#app"), bar = $("#bar");
  const banner = S.loadNote ? `<div class="banner warn">${esc(S.loadNote)}</div>` : (!cur() && S.mode === "local" ? `<div class="banner info">记录只保存在这台设备的浏览器里。换手机、换电脑看不到，清理浏览器数据会丢失，整理完记得导出。</div>` : "");
  if (S.loading) { app.innerHTML = `<header class="top"><h1>出差报销助手</h1></header><div class="empty">正在读取你的数据…</div>`; bar.innerHTML = ""; return; }
  const t = cur();
  if (!t) { app.innerHTML = banner + renderHome(); bar.innerHTML = `<div class="bar"><div class="in"><button class="primary" data-act="new-trip">＋ 新建一次出差</button></div></div>`; return; }
  app.innerHTML = banner + renderTrip(t);
  bar.innerHTML = S.tab === "list"
    ? `<div class="bar"><div class="in"><button class="primary" data-act="shots">📷 上传截图${aiReady() ? "（AI 自动识别）" : ""}</button><button data-act="manual" style="flex:0 0 auto">＋ 手动记一笔</button></div></div>`
    : "";
}
function dateSpan(t) {
  const ds = t.expenses.map(e => e.date).filter(Boolean).sort();
  if (!ds.length) return "";
  return " · " + esc(ds[0]) + (ds[ds.length - 1] !== ds[0] ? " ~ " + esc(ds[ds.length - 1]) : "");
}
function tripTotals(t) {
  const sum = t.expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const pend = t.expenses.filter(e => e.status !== "ok").length;
  return { sum, pend, n: t.expenses.length };
}
function renderHome() {
  const list = S.trips.map(t => {
    const { sum, pend, n } = tripTotals(t);
    const st = n === 0 ? `<span class="pill">还没有费用</span>` : pend ? `<span class="pill pending">${pend} 笔待确认</span>` : `<span class="pill ok">已全部确认</span>`;
    return `<div class="card trip-card" data-act="open" data-id="${t.id}">
      <div class="row"><div class="grow"><h3>${esc(t.name)}</h3><div class="muted">${esc(t.project)}${dateSpan(t)}${t.city ? " · " + esc(t.city) : ""}</div></div>
      <div style="text-align:right"><div class="big">${money(sum)}</div><div class="muted">${n} 笔</div></div></div>
      <div style="margin-top:8px">${st}${t.exportedAt ? ` <span class="pill">已导出过</span>` : ""}</div></div>`;
  }).join("");
  return `<header class="top"><h1>出差报销助手</h1><button class="ghost" data-act="ai">🤖 ${aiReady() ? "AI：" + esc(aiName()) : "AI 设置（未设置）"}</button><button class="ghost" data-act="settings">⚙︎ 我的信息</button></header>
    ${aiReady() ? "" : `<div class="banner info" style="cursor:pointer" data-act="ai">🤖 还没设置 AI 识别：设置后上传截图会自动填写金额和日期。<b>点这里设置 →</b></div>`}
    ${S.trips.length ? list : `<div class="card empty"><div class="e">🧳</div><p><b>还没有出差记录</b></p><p class="muted">出一次差建一个。出差路上随手把付款截图传上来，<br>回来以后核对一遍，一键导出报销表。</p></div>`}`;
}
function renderTrip(t) {
  const { sum, pend, n } = tripTotals(t);
  const head = `<header class="top"><button class="ghost" data-act="home">‹ 返回</button><div class="grow"><h1>${esc(t.name)}</h1><div class="crumb">${esc(t.project)}${dateSpan(t)}</div></div><button class="ghost" data-act="edit-trip">编辑</button></header>
    <div class="card"><div class="row"><div class="grow"><div class="muted">合计</div><div class="big">${money(sum)}</div></div>
      <div style="text-align:right"><div class="muted">${n} 笔</div>${pend ? `<span class="pill pending">${pend} 笔待确认</span>` : n ? `<span class="pill ok">已全部确认</span>` : ""}</div></div></div>
    <div class="tabs"><button class="${S.tab === "list" ? "on" : ""}" data-act="tab" data-tab="list">费用明细</button><button class="${S.tab === "review" ? "on" : ""}" data-act="tab" data-tab="review">审核 & 导出</button></div>`;
  return head + (S.tab === "list" ? renderList(t) : renderReview(t));
}
function renderList(t) {
  if (!t.expenses.length) return `<div class="card empty"><div class="e">🧾</div><p><b>还没有费用</b></p><p class="muted">点下方「上传截图」，可以一次选多张。<br>每张截图会变成一笔费用${aiReady() ? "，AI 会先帮你填好日期、金额和描述" : ""}。</p>${aiReady() ? "" : `<p><button data-act="ai">🤖 设置 AI 自动识别（可选）</button></p>`}</div>`;
  const all = sortExpenses(t.expenses);
  const shown = all.filter(e => S.filter === "all" || (S.filter === "pending" ? e.status !== "ok" : e.status === "ok"));
  const cnt = k => k === "all" ? all.length : all.filter(e => k === "pending" ? e.status !== "ok" : e.status === "ok").length;
  const f = `<div class="filters">${[["all", "全部"], ["pending", "待确认"], ["ok", "已确认"]].map(([k, l]) => `<button class="${S.filter === k ? "on" : ""}" data-act="filter" data-f="${k}">${l} ${cnt(k)}</button>`).join("")}</div>`;
  return f + shown.map(e => renderExp(e, all.indexOf(e) + 1)).join("") + (shown.length ? "" : `<div class="empty muted">这里没有费用</div>`);
}
function thumbs(e, showAdd) {
  return `<div class="thumbs">${e.images.map((im, i) => `<img class="thumb" src="${esc(imgSrc(im))}" data-act="zoom" data-src="${esc(imgSrc(im))}" alt="截图${i + 1}">`).join("")}
    ${showAdd ? `<button class="ghost addimg" data-act="add-img" data-id="${e.id}">＋ 图片</button>` : ""}</div>`;
}
function renderExp(e, no) {
  if (e.status === "reading") return `<div class="card exp reading">${thumbs(e, false)}<div class="sumline"><span class="pill reading">AI 正在读这张截图…</span><div class="muted" style="margin-top:6px">一般十几秒，可以继续上传别的。</div></div></div>`;
  if (e.status === "ok" && !S.editing.has(e.id)) {
    return `<div class="card exp ok">${thumbs(e, false)}<div class="sumline"><div class="t">${no}. ${esc(e.content)}</div>
      <div class="muted">${esc(e.date)} · ${esc(e.type)}${e.needInvoice ? " · 需补发票" : ""}${e.images.length > 1 ? ` · ${e.images.length} 张图` : ""}</div></div>
      <div style="text-align:right"><div class="amt">${e.currency !== "RMB" ? esc(e.currency) + " " : "¥"}${esc(e.amount)}</div><button class="ghost" data-act="edit" data-id="${e.id}">修改</button></div></div>`;
  }
  const low = e.aiConf === "low" || e.aiConf === "medium";
  return `<div class="card exp pending ${low ? "ai-low" : ""}">${thumbs(e, true)}
    <div class="fields">
      <div class="full row"><span class="pill pending">${no}. 待确认</span>${e.aiConf ? `<span class="muted">AI 已填写${e.aiConf === "high" ? "" : e.aiConf === "medium" ? "（有点不确定）" : "（很不确定）"}，请对照截图检查</span>` : ""}</div>
      ${e.aiNote ? `<div class="full ai-note">${esc(e.aiNote)}</div>` : ""}
      <div><label>日期</label><input type="date" class="ai" data-f="date" data-id="${e.id}" value="${esc(e.date)}"></div>
      <div><label>金额</label><div class="row" style="flex-wrap:nowrap;gap:6px"><input type="number" inputmode="decimal" step="0.01" class="ai" data-f="amount" data-id="${e.id}" value="${esc(e.amount)}" placeholder="0.00">
        <select data-f="currency" data-id="${e.id}" style="width:84px">${CURRENCIES.map(c => `<option ${c === e.currency ? "selected" : ""}>${c}</option>`).join("")}</select></div></div>
      <div class="full"><label>类型</label><div class="seg">${TYPES.map(ty => `<button class="${ty === e.type ? "on" : ""}" data-act="type" data-id="${e.id}" data-v="${ty}">${ty}</button>`).join("")}</div></div>
      <div class="full"><label>店名 + 做了什么（日期导出时自动加在前面）</label><input class="ai" data-f="content" data-id="${e.id}" value="${esc(e.content)}" placeholder="如：星巴克 买咖啡"></div>
      <div class="full row"><label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-size:14px"><input type="checkbox" style="width:auto" data-f="needInvoice" data-id="${e.id}" ${e.needInvoice ? "checked" : ""}> 需补开发票</label>
        <span class="grow"></span>
        ${aiReady() && e.images.length ? `<button class="ghost" data-act="rerun" data-id="${e.id}">重新识别</button>` : ""}
        <button class="ghost" data-act="del" data-id="${e.id}" style="color:var(--danger)">删除</button>
        <button class="primary" data-act="confirm" data-id="${e.id}">✓ 确认</button></div>
    </div></div>`;
}
function renderReview(t) {
  const list = sortExpenses(t.expenses);
  if (!list.length) return `<div class="card empty">先添加费用，再来这里审核导出。</div>`;
  const by = {}; TYPES.forEach(ty => by[ty] = 0); list.forEach(e => by[e.type] = (by[e.type] || 0) + (Number(e.amount) || 0));
  const { checks, canExport } = reviewChecks(t);
  const imgs = list.reduce((s, e) => s + e.images.length, 0);
  const plan = planPages(list.map((e, i) => ({ e, no: i + 1 })), t.perPage || "auto");
  return `<div class="card"><div class="stats">
      <div class="stat"><div class="k">合计</div><div class="v">${money(list.reduce((s, e) => s + (Number(e.amount) || 0), 0))}</div></div>
      ${TYPES.map(ty => `<div class="stat"><div class="k">${ty}</div><div class="v">${money(by[ty])}</div></div>`).join("")}
    </div></div>
    <div class="card"><b>导出前检查</b>${checks.map(c => `<div class="check ${c.lvl}"><div class="ic">${c.lvl === "good" ? "✓" : c.lvl === "bad" ? "✕" : "!"}</div><div class="grow"><div>${esc(c.t)}</div>${c.d ? `<div class="muted">${esc(c.d)}</div>` : ""}${c.items ? `<ul>${c.items.slice(0, 8).map(i => `<li>${esc(i)}</li>`).join("")}${c.items.length > 8 ? `<li>……还有 ${c.items.length - 8} 笔</li>` : ""}</ul>` : ""}</div></div>`).join("")}</div>
    <div class="card"><b>导出内容预览</b>
      <ul class="muted" style="padding-left:18px;margin:8px 0">
        <li>汇总表：${list.length} 笔费用，按日期排序，末行自动合计</li>
        <li>收据名示例：${esc(receiptLabel(list[0], t, S.settings))}</li>
        <li>收据页：${imgs} 张图，共 ${plan.length} 页（${t.perPage === "auto" || !t.perPage ? "自动排版" : t.perPage === "1" || t.perPage === 1 ? "每页 1 笔" : "每页 3 张"}）；点击收据名可跳转到对应图片，每页左上角可返回汇总表</li>
      </ul>
      <button class="primary" id="exportBtn" data-act="export" style="width:100%;padding:13px" ${canExport ? "" : "disabled"}>${canExport ? "⬇ 导出 Excel 报销表" : "还有没确认或没填完的费用，暂时不能导出"}</button>
    </div>`;
}

/* ============ 事件 ============ */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, t = cur();
  const exp = t && el.dataset.id ? t.expenses.find(x => x.id === el.dataset.id) : null;
  switch (act) {
    case "close-bg": if (ev.target === el) closeModal(); break;
    case "close": closeModal(); break;
    case "new-trip": if (!S.settings.reporter) settingsForm(true); else tripForm(); break;
    case "edit-trip": tripForm(t); break;
    case "settings": settingsForm(); break;
    case "ai": aiForm(); break;
    case "open": S.curId = el.dataset.id; S.tab = "list"; S.filter = "all"; render(); window.scrollTo(0, 0); break;
    case "home": S.curId = null; render(); break;
    case "tab": S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case "filter": S.filter = el.dataset.f; render(); break;
    case "shots": $("#fileShots").click(); break;
    case "manual": { const e = newExpense({ date: today() }); t.expenses.push(e); saveTrip(t); S.filter = "all"; render(); setTimeout(() => { const i = document.querySelector(`[data-f="content"][data-id="${e.id}"]`); i && (i.scrollIntoView({ block: "center" }), i.focus()); }, 50); break; }
    case "add-img": addTargetId = el.dataset.id; $("#fileAdd").click(); break;
    case "zoom": $("#overlay").innerHTML = `<div class="lightbox" data-act="close"><img src="${esc(el.dataset.src)}"></div>`; break;
    case "type": exp.type = el.dataset.v; saveTrip(t); el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); break;
    case "confirm": {
      const m = missing(exp);
      if (m.length) { toast("还缺：" + m.join("、")); break; }
      exp.amount = Math.round(Number(exp.amount) * 100) / 100;
      exp.status = "ok"; exp.aiNote = ""; S.editing.delete(exp.id); saveTrip(t); render(); break;
    }
    case "edit": exp.status = "pending"; S.editing.delete(exp.id); saveTrip(t); render(); break;
    case "rerun": rerunAI(exp); break;
    case "del": confirmBox("删除这笔费用？", `${exp.content || "这笔费用"}${exp.amount ? " " + money(exp.amount) : ""}，截图也会一起删除。`, "删除", async () => {
      t.expenses = t.expenses.filter(x => x.id !== exp.id); saveTrip(t); render();
      for (const im of exp.images) await removeImage(im);
    }); break;
    case "export": doExport(); break;
  }
});
document.addEventListener("input", ev => {
  const el = ev.target; const f = el.dataset && el.dataset.f; if (!f) return;
  const t = cur(); const e = t && t.expenses.find(x => x.id === el.dataset.id); if (!e) return;
  if (f === "needInvoice") e.needInvoice = el.checked;
  else if (f === "amount") e.amount = el.value === "" ? "" : Number(el.value);
  else e[f] = el.value;
  saveTrip(t, 600);
});
$("#fileShots").addEventListener("change", ev => { const fs = [...ev.target.files]; ev.target.value = ""; handleShots(fs); });
$("#fileAdd").addEventListener("change", ev => { const fs = [...ev.target.files]; ev.target.value = ""; handleAddImgs(fs); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.settings.reporter) closeModal(); });

init();
</script>
</body>
